name: infra-stack

services:

  # Dynamic DNS
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      - SUBDOMAINS=la-taverne-de-may
      - TOKEN=${DUCKDNS_TOKEN}
      - TZ=${TZ}

  # Reverse proxy + SSL
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./config/nginx-proxy-manager/data:/data
      - ./config/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network
      - infra
      - app-network

  # DNS server
  adguardhome:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/adguardhome/conf:/opt/adguardhome/conf
      - ./config/adguardhome/work:/opt/adguardhome/work

networks:
  infra:
    driver: bridge

  proxy-network:
    external: true

  app-network:
    external: true
    name: recipes-deploy_app-network
